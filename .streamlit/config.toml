# Configuración de la app (se aplica sola al correr "streamlit run app.py").

[server]
# No vigilar los archivos del proyecto: en un disco de red hace lenta la app.
# (Si se cambia el código, hay que cerrar y volver a abrir la app.)
fileWatcherType = "none"
# Solo accesible desde esta compu: no pide permiso al firewall ni la ve nadie de la red.
address = "localhost"
# Sirve la carpeta static/ (la fuente Overpass va incluida: anda sin internet).
enableStaticServing = true

[browser]
# No mandar estadísticas de uso a Streamlit.
gatherUsageStats = false

# ---------------------------------------------------------------- apariencia
# Con la marca Ferrovías: el rojo de las franjas del logo como color principal,
# texto grafito como el logotipo, fondo gris andén y colores de señal
# (verde / amarillo) para los estados. Los degradados están en app.py.
[theme]
base = "light"
primaryColor = "#D41920"              # rojo Ferrovías (un punto más oscuro que #ED1E24, para leer bien texto blanco)
backgroundColor = "#F4F3F2"           # andén
secondaryBackgroundColor = "#E8E6E4"  # balasto
textColor = "#1C1A19"                 # grafito del logotipo
linkColor = "#B5131A"
borderColor = "#D3CFCC"
showWidgetBorder = true
greenColor = "#2F7D4A"                # señal verde: asociado / listo
yellowColor = "#C98A00"               # señal amarilla: pendiente / atención
redColor = "#B3261E"                  # señal roja: error
blueColor = "#3B5B78"                 # avisos informativos
font = "Overpass, sans-serif"
headingFont = "Overpass, sans-serif"
headingFontWeights = [800, 700, 700, 600, 600, 600]
baseRadius = "0.3rem"
buttonRadius = "0.3rem"
dataframeHeaderBackgroundColor = "#E8E6E4"

[[theme.fontFaces]]
family = "Overpass"
url = "app/static/fuentes/Overpass-Variable.ttf"
weight = "100 900"

# Menú lateral rojo (el degradado se agrega en app.py).
[theme.sidebar]
backgroundColor = "#C4161D"
secondaryBackgroundColor = "#A8121A"
textColor = "#FFFFFF"
primaryColor = "#FFFFFF"
borderColor = "#E0575C"
